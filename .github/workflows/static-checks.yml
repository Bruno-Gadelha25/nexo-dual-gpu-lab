# Verificações estáticas. NÃO há GPU neste runner: um resultado verde não valida
# comportamento Multi-GPU, D3D12 ou Cross-Adapter.
name: static-checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificações estáticas (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/static-checks.ps1
      - name: Verificações estáticas (PowerShell 7)
        shell: pwsh
        run: ./scripts/static-checks.ps1
      - name: Reanálise da Fase 3
        shell: pwsh
        run: python -I analysis/reanalyze_phase3.py
      - name: Aviso
        shell: pwsh
        run: Write-Host 'Nenhuma GPU foi usada. Isto não é teste Multi-GPU.'
